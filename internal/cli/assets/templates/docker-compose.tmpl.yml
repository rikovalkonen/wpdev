# Generated by wpdev. Put personal additions in docker-compose.override.yml.
services:
  php:
    build:
      context: .
      dockerfile: .wpdev/generated/php.Dockerfile
      args:
        PHP_VERSION: {{quote .Web.PHP}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./:/var/www/html:delegated
{{if .TLS.Enabled}}
      - ./.wpdev/certs/rootCA.pem:/usr/local/share/ca-certificates/wpdev-rootCA.crt:ro
{{end}}
{{if .WordPress}}
      - ./.wpdev/generated/wpdev-local.php:/opt/wpdev/wpdev-local.php:ro
      - ./.wpdev/generated/remote-media.php:/opt/wpdev/remote-media.php:ro
{{end}}
{{range .PluginMounts}}
      - type: bind
        source: {{quote .Source}}
        target: {{quote .Target}}
        read_only: true
{{end}}
    environment:
      XDEBUG_MODE: {{if .Xdebug.Enabled}}debug,develop{{else}}off{{end}}
      PHP_IDE_CONFIG: serverName=wpdev
      WPDEV_LOCAL: "1"
{{if .RemoteMediaConfigured}}
      WP_ENV: development
{{end}}
      WP_CLI_CONFIG_PATH: /var/www/html/.wpdev/generated/wp-cli.yml
      WPDEV_TLS_FINGERPRINT: {{quote .TLSFingerprint}}
      WPDEV_RUNTIME_FINGERPRINT: {{quote .RuntimeFingerprint}}
      CURL_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
    depends_on:
      db:
        condition: service_healthy
{{if ne .Web.Server "apache"}}
  web:
    image: nginx:stable
    environment:
      WPDEV_RUNTIME_FINGERPRINT: {{quote .RuntimeFingerprint}}
    volumes:
      - ./:/var/www/html:delegated
      - ./.wpdev/generated/nginx.conf:/etc/nginx/conf.d/default.conf:ro
{{range .PluginMounts}}
      - type: bind
        source: {{quote .Source}}
        target: {{quote .Target}}
        read_only: true
{{end}}
    depends_on:
      - php
{{end}}
  db:
    image: {{.Database.Engine}}:{{.Database.Version}}
    environment:
      {{if eq .Database.Engine "mysql"}}MYSQL{{else}}MARIADB{{end}}_DATABASE: wordpress
      {{if eq .Database.Engine "mysql"}}MYSQL{{else}}MARIADB{{end}}_USER: wp
      {{if eq .Database.Engine "mysql"}}MYSQL{{else}}MARIADB{{end}}_PASSWORD: secret
      {{if eq .Database.Engine "mysql"}}MYSQL{{else}}MARIADB{{end}}_ROOT_PASSWORD: root
    healthcheck:
      test: ["CMD-SHELL", "{{if eq .Database.Engine "mysql"}}mysqladmin{{else}}mariadb-admin{{end}} ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 2s
      timeout: 5s
      retries: 60
    volumes:
{{if eq .Database.Persist "bind"}}
      - ./{{.Database.DataPath}}:/var/lib/mysql
{{else}}
      - dbdata:/var/lib/mysql
{{end}}
{{if .Database.Portforward}}
    ports:
      - "{{.Database.Portforward}}:3306"
{{end}}
{{if .Services.Redis}}
  redis:
    image: redis:7-alpine
{{end}}
{{if .Services.Mailpit}}
  mailpit:
    image: axllent/mailpit
{{end}}
{{if .Services.Adminer}}
  adminer:
    image: adminer:latest
    depends_on:
      - db
{{end}}
  caddy:
    image: caddy:2
    environment:
      WPDEV_TLS_FINGERPRINT: {{quote .TLSFingerprint}}
      WPDEV_RUNTIME_FINGERPRINT: {{quote .RuntimeFingerprint}}
    networks:
      default:
        aliases:
{{range .Aliases}}
          - {{quote .}}
{{end}}
    depends_on:
      - {{if eq .Web.Server "apache"}}php{{else}}web{{end}}
{{if .Services.Mailpit}}
      - mailpit
{{end}}
{{if .Services.Adminer}}
      - adminer
{{end}}
    ports:
      - "80:80"
{{if .TLS.Enabled}}
      - "443:443"
{{end}}
    volumes:
      - ./.wpdev/generated/Caddyfile:/etc/caddy/Caddyfile:ro
{{if .TLS.Enabled}}
      - ./.wpdev/certs:/certs:ro
{{end}}
{{if ne .Database.Persist "bind"}}
volumes:
  dbdata: {}
{{end}}
networks:
  default: {}
